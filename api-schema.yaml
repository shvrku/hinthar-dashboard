  /api/v1/sessions/generate/{class_id}/:
    post:
      operationId: sessions_generate_create
      description: Generate dated sessions from timetable slots for a specific class.
        By default generates from today until the end of the current month. Optionally
        accepts start_date and end_date to target a different range (e.g. next month).
      summary: Generate sessions for a class
      parameters:
      - in: path
        name: class_id
        schema:
          type: integer
        required: true
      tags:
      - sessions
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                start_date:
                  type: string
                  format: date
                  description: Defaults to today
                end_date:
                  type: string
                  format: date
                  description: Defaults to end of month
      security:
      - clerk_jwt: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  class_id:
                    type: integer
                  date_range:
                    type: object
                    properties:
                      from:
                        type: string
                        format: date
                      to:
                        type: string
                        format: date
                  total_created:
                    type: integer
                  total_already_existed:
                    type: integer
          description: ''
