  /api/v1/check-ins/manual/:
    post:
      operationId: check_ins_manual_create
      description: Check in a student manually using their student ID.
      summary: Manual check-in
      tags:
      - check-ins
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                student_id:
                  type: integer
                  description: The numeric student ID
              required:
              - student_id
      security:
      - clerk_jwt: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckIn'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                MissingOrInvalidStudentId:
                  value:
                    error: student_id must be a valid integer
                  summary: Missing or invalid student_id
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                StudentNotFound:
                  value:
                    error: Student not found
                  summary: Student not found
          description: ''
        '409':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                AlreadyCheckedIn:
                  value:
                    error: Student already checked in today
                  summary: Already checked in
          description: ''
  /api/v1/check-ins/qr/:
    post:
      operationId: check_ins_qr_create
      description: Check in a student using their unique QR check-in token.
      summary: QR code check-in
      tags:
      - check-ins
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                check_in_token:
                  type: string
                  description: The student's unique QR check-in token
              required:
              - check_in_token
      security:
      - clerk_jwt: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckIn'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              examples:
                MissingOrInvalidToken:
                  value:
                    error: check_in_token is required
                  summary: Missing or invalid token
          description: ''
        '409':
