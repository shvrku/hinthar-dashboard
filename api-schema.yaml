            application/json:
              schema:
                $ref: '#/components/schemas/Adjustment'
          description: ''
  /api/v1/adjustments/{id}/:
    get:
      operationId: adjustments_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this adjustment.
        required: true
      tags:
      - adjustments
