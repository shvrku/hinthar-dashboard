components:
  schemas:
    Adjustment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        payslip:
          type: integer
        description:
          type: string
        amount:
          type: string
      required:
      - payslip
      - description
      - amount
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user_email:
          type: string
          readOnly: true
        action:
          type: string
        resource_type:
          type: string
        resource_id:
          type: string
        details:
          type: object
          additionalProperties: {}
        timestamp:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - resource_type
      - resource_id
    CheckIn:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        student:
          type: integer
        student_name:
          type: string
          readOnly: true
        date:
          type: string
          format: date
          readOnly: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
        check_in_type:
          type: string
          enum:
          - qr
          - manual
      required:
      - student
      - check_in_type
    PatchedCheckIn:
      type: object
      properties:
        student:
          type: integer
        check_in_type:
          type: string
          enum:
          - qr
          - manual
    Class:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        education_level:
          type: string
          enum:
          - IAL
          - IG
          - Year1
          - Year2
          - Year3
          - Year4
          - Year5
          - Year6
          - Year7
          - Year8
          - Year9
        cohort_identifier:
          type: string
        cohort_sub_category:
          type: string
          nullable: true
      required:
      - education_level
      - cohort_identifier
    PatchedClass:
      type: object
      properties:
        education_level:
          type: string
          enum:
          - IAL
          - IG
          - Year1
          - Year2
          - Year3
          - Year4
          - Year5
          - Year6
          - Year7
          - Year8
          - Year9
        cohort_identifier:
          type: string
        cohort_sub_category:
          type: string
          nullable: true
    ClassStudent:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        student:
          type: integer
        class_obj:
          type: integer
      required:
      - student
      - class_obj
    PatchedClassStudent:
      type: object
      properties:
        student:
          type: integer
        class_obj:
          type: integer
    PayPeriod:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
      required:
      - start_date
      - end_date
    PatchedPayPeriod:
      type: object
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
    Payslip:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        teacher:
          type: integer
        teacher_name:
          type: string
          readOnly: true
        pay_period:
          type: integer
        total_sessions:
          type: integer
          readOnly: true
        hourly_rate:
          type: string
        total_amount:
          type: string
          readOnly: true
        status:
          type: string
          enum:
          - draft
          - paid
          - cancelled
      required:
      - teacher
      - pay_period
    PatchedPayslip:
      type: object
      properties:
        teacher:
          type: integer
        pay_period:
          type: integer
        hourly_rate:
          type: string
        status:
          type: string
          enum:
          - draft
          - paid
          - cancelled
    Report:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
        description:
          type: string
        file:
          type: string
          format: uri
          readOnly: true
        generated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - title
    Session:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        timetable_slot:
          type: object
          additionalProperties: {}
        teacher:
          type: integer
        class_obj:
          type: integer
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        status:
          type: string
          nullable: true
          enum:
          - scheduled
          - completed
          - cancelled
          - no_show
        paid:
          type: boolean
          nullable: true
        payslip:
          type: integer
          nullable: true
          readOnly: true
      required:
      - start_time
      - end_time
    PatchedSession:
      type: object
      properties:
        teacher:
          type: integer
        class_obj:
          type: integer
        start_time:
          type: string
          format: date-time
        end_time:
          type: string
          format: date-time
        status:
          type: string
          nullable: true
          enum:
          - scheduled
          - completed
          - cancelled
          - no_show
        paid:
          type: boolean
          nullable: true
    Student:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        dob:
          type: string
          format: date
          nullable: true
        enrollment_date:
          type: string
          format: date
          readOnly: true
        contact:
          type: string
          nullable: true
        user_id:
          type: integer
          readOnly: true
        check_in_token:
          type: string
          readOnly: true
      required:
      - name
    PatchedStudent:
      type: object
      properties:
        name:
          type: string
        dob:
          type: string
          format: date
          nullable: true
        contact:
          type: string
          nullable: true
    Teacher:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
        employment_type:
          type: string
          nullable: true
          enum:
          - full_time
          - tutor
        default_rate:
          type: string
          nullable: true
        contact:
          type: string
          nullable: true
        bank_details:
          type: string
          nullable: true
        user_id:
          type: integer
          readOnly: true
      required:
      - name
    PatchedTeacher:
      type: object
      properties:
        name:
          type: string
        employment_type:
          type: string
          nullable: true
          enum:
          - full_time
          - tutor
        default_rate:
          type: string
          nullable: true
        contact:
          type: string
          nullable: true
        bank_details:
          type: string
          nullable: true
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        user_type:
          type: string
          enum:
          - admin
          - staff
          - teacher
          - student
          - parent
        clerk_id:
          type: string
          readOnly: true
      required:
      - email
      - user_type