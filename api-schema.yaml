components:
  schemas:
    ActionEnum:
      enum:
      - create
      - update
      - delete
      type: string
      description: |-
        * `create` - Create
        * `update` - Update
        * `delete` - Delete
    AdHocSession:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        teacher:
          allOf:
          - $ref: '#/components/schemas/Teacher'
          readOnly: true
        subject:
          allOf:
          - $ref: '#/components/schemas/Subject'
          readOnly: true
        teacher_id:
          type: integer
        subject_id:
          type: integer
        date:
          type: string
          format: date
        start_time:
          type: string
          format: time
        end_time:
          type: string
          format: time
        status:
          $ref: '#/components/schemas/SessionStatusEnum'
        paid:
          type: boolean
      required:
      - date
      - end_time
      - id
      - start_time
      - subject
      - subject_id
      - teacher
      - teacher_id
    AdHocSessionAttendance:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ad_hoc_session:
          allOf:
          - $ref: '#/components/schemas/AdHocSession'
          readOnly: true
        student:
          allOf:
          - $ref: '#/components/schemas/Student'
          readOnly: true
        status:
          $ref: '#/components/schemas/SessionAttendanceStatusEnum'
        ad_hoc_session_id:
          type: integer
        student_id:
          type: integer
      required:
      - ad_hoc_session
      - ad_hoc_session_id
      - id
      - student
      - student_id
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          readOnly: true
          nullable: true
        user_email:
          type: string
          nullable: true
          readOnly: true
        model_name:
          type: string
          readOnly: true
        record_id:
          type: string
          readOnly: true
        action:
          allOf:
          - $ref: '#/components/schemas/ActionEnum'
          readOnly: true
        field_name:
          type: string
          readOnly: true
          nullable: true
        old_value:
          type: string
          readOnly: true
          nullable: true
        new_value:
          type: string
          readOnly: true
          nullable: true
        timestamp:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - field_name
      - id
      - model_name
      - new_value
      - old_value
      - record_id
      - timestamp
      - user
      - user_email
    CheckIn:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
