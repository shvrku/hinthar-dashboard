  /api/v1/check-ins/manual/:
    post:
      operationId: check_ins_manual_create
      description: Check in a student manually using their student ID.
      summary: Manual check-in
      tags:
      - check-ins
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                student_id:
                  type: integer
                  description: The numeric student ID
              required:
              - student_id
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckIn'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ''
        '404':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
                description: Unspecified response body
          description: ''
        '409':
